:root{--pomodoro:#c8301e;--deep:#9c260b;--semola:#f0e2bd;--soft:#f6ecd3;--latte:#fbf6ea;--forno:#16110d;--ink:#221812;--linea:#e2cf9f;--muto:#5f4a3a;--ease:cubic-bezier(.2,.7,.1,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--semola);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.installa{background:var(--soft);border-radius:6px;padding:14px;margin-top:22px;font-size:14px}
.installa p{margin:0 0 10px}
.installa p:last-child{margin:0}
.installa .pill{flex:none;width:100%}
.prova{background:var(--forno);color:var(--latte);font-size:12px;letter-spacing:.14em;font-weight:700;text-align:center;padding:6px 12px;text-transform:uppercase}
.vista{display:none;flex:1;flex-direction:column;padding:20px 20px 120px}
.vista.attiva{display:flex;animation:entra .25s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.vista.attiva{animation:none}}
.logo svg{width:150px;height:auto;display:block}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:46px;line-height:.92;margin:22px 0 6px;color:var(--forno);letter-spacing:-.01em}
h1 em{color:var(--pomodoro)}
.lead{margin:0 0 6px;color:var(--muto);font-size:15px}
.etichetta{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--deep);text-transform:uppercase;margin:24px 0 8px}
.campo{width:100%;background:var(--soft);border:1px solid transparent;border-radius:6px;padding:12px 14px;font-size:16px}
.campo:focus{border-color:var(--forno);outline:none}
textarea.campo{min-height:84px;resize:vertical}
.scelte{display:grid;gap:8px}
.scelta{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border:0;border-radius:6px;padding:14px;text-align:left;cursor:pointer;font-size:16px;transition:background .25s var(--ease),color .25s var(--ease)}
.scelta small{font-size:13px;color:var(--muto)}
.scelta[aria-pressed="true"]{background:var(--forno);color:var(--latte)}
.scelta[aria-pressed="true"] small{color:var(--semola)}
.errore{color:var(--deep);font-size:14px;font-weight:700;margin:10px 0 0;min-height:1em}
.barra{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--semola);border-top:1px solid var(--linea)}
.barra .dentro{max-width:480px;margin:0 auto;display:flex;gap:10px}
.pill{flex:1;border:0;border-radius:999px;background:var(--pomodoro);color:var(--latte);padding:15px 18px;font-size:13px;letter-spacing:.11em;font-weight:700;text-transform:uppercase;cursor:pointer;transition:background .25s var(--ease)}
.pill:hover{background:var(--deep)}
.pill.chiara{background:transparent;color:var(--forno);border:1.5px solid var(--forno);flex:0 0 auto}
.testa{display:flex;align-items:center;justify-content:space-between;gap:10px}
.indietro{background:none;border:0;padding:6px 0;font-size:13px;letter-spacing:.11em;font-weight:700;text-transform:uppercase;color:var(--deep);cursor:pointer}
.chi{font-size:13px;color:var(--muto);text-align:right}
.cerca{margin-top:14px}
.cat{border-top:1px solid var(--linea)}
.cat:last-of-type{border-bottom:1px solid var(--linea)}
.cat>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:16px 0;cursor:pointer;text-align:left}
.cat>button span:first-child{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--deep);text-transform:uppercase}
.cat>button .conta{font-size:13px;color:var(--muto)}
.cat>button .conta b{color:var(--pomodoro)}
.prodotti{display:none;padding-bottom:10px}
.cat.aperta .prodotti{display:grid;gap:6px}
.riga{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:6px;padding:10px 12px}
.riga.scelto{background:var(--latte)}
.nome{font-size:15px}
.dett{display:block;font-size:13px;color:var(--muto)}
.passo{display:flex;align-items:center;gap:6px;flex-shrink:0}
.passo button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--deep);background:transparent;color:var(--deep);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.passo button.piu{background:var(--deep);color:var(--latte)}
.passo output{min-width:22px;text-align:center;font-weight:700;font-size:16px}
.vuoto{color:var(--muto);font-size:15px;padding:16px 0}
.altro{display:grid;grid-template-columns:1fr 84px;gap:8px}
.ok{background:var(--forno);color:var(--latte);border-radius:6px;padding:18px;margin-top:20px}
.ok p{margin:0 0 8px}
.ok p:last-child{margin:0}
.nota{font-size:14px;color:var(--muto);margin:14px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.io{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:6px;padding:6px 14px;margin:0}
.pill:disabled{opacity:.6;cursor:default}
</style>
</head>

function salva(){try{localStorage.setItem("annare-ordini",JSON.stringify({sede:st.sede}))}catch(e){}}
try{const v=JSON.parse(localStorage.getItem("annare-ordini")||"{}");st.sede=v.sede||""}catch(e){}

function vai(n){document.querySelectorAll(".vista").forEach(v=>v.classList.toggle("attiva",v.id==="v-"+n));window.scrollTo(0,0)}
document.querySelectorAll("[data-vai]").forEach(b=>b.onclick=()=>vai(b.dataset.vai));
const key=(c,p)=>c+"|"+p;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function scelte(el,lista,att,on){el.innerHTML=lista.map(([v,s])=>`<button class="scelta" aria-pressed="${v===att}" data-v="${esc(v)}">${esc(v)}${s?`<small>${s}</small>`:""}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{on(b.dataset.v);el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))})}
function inizio(){
  $("#nome").textContent=st.nome;
  scelte($("#sedi"),SEDI.map(s=>[s,""]),st.sede,v=>{st.sede=v;salva();$("#err-inizio").textContent=""});
  scelte($("#reparti"),Object.keys(DATI).map(r=>[r,Object.values(DATI[r]).reduce((a,c)=>a+c.length,0)+" prodotti"]),st.reparto,v=>{if(v!==st.reparto){st.q={};st.aperte={}}st.reparto=v;$("#err-inizio").textContent=""});
}
async function sessione(){
  try{const r=await fetch("/api/sessione");if(r.ok){st.nome=(await r.json()).nome;inizio()}else if(r.status===401)vai("accesso")}catch(e){}
}
const json=(url,dati)=>fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dati)});
$("#f-accesso").onsubmit=async e=>{
  e.preventDefault();const err=$("#err-accesso"),btn=$("#entra");err.textContent="";btn.disabled=true;
  try{
    const r=await json("/api/sessione",{codice:$("#codice").value}),d=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=d.errore||"Codice non valido.";return}
    st.nome=d.nome;$("#codice").value="";inizio();vai(st.dopo||"inizio");st.dopo="";
  }catch(x){err.textContent="Nessuna connessione. Riprova."}
  finally{btn.disabled=false}
};
$("#esci").onclick=async()=>{try{await fetch("/api/sessione",{method:"DELETE"})}catch(e){}st.nome="";vai("accesso")};
$("#vai-lista").onclick=()=>{
  if(!st.nome)return vai("accesso");
  const m=!st.sede?"Scegli la sede.":!st.reparto?"Scegli il reparto.":"";
  if(m){$("#err-inizio").textContent=m;return}
  $("#nome-reparto").textContent=st.reparto.toLowerCase();
  $("#chi-lista").textContent=st.nome+", "+st.sede;
  $("#cerca").value="";lista();vai("lista");
};

function lista(){
  const f=$("#cerca").value.trim().toLowerCase();
  const cats=DATI[st.reparto];let html="";
  for(const c in cats){
    const prod=cats[c].filter(p=>!f||p[0].toLowerCase().includes(f)||(p[1]||"").toLowerCase().includes(f));
    if(!prod.length)continue;
    const n=cats[c].filter(p=>st.q[key(c,p[0])]>0).length;
    const aperta=f||st.aperte[c];
    html+=`<div class="cat${aperta?" aperta":""}" data-c="${esc(c)}"><button aria-expanded="${!!aperta}"><span>${esc(c)}</span><span class="conta">${n?`<b>${n} scelti</b> · `:""}${cats[c].length}</span></button><div class="prodotti">`+
      prod.map(p=>{const k=key(c,p[0]),q=st.q[k]||0;return `<div class="riga${q?" scelto":""}" data-k="${esc(k)}"><span class="nome">${esc(p[0])}<span class="dett">${esc([p[1],p[2]].filter(Boolean).join(", ")||"formato da indicare")}</span></span><span class="passo"><button class="meno" aria-label="Togli uno">−</button><output>${q}</output><button class="piu" aria-label="Aggiungi uno">+</button></span></div>`}).join("")+`</div></div>`;
  }
  $("#categorie").innerHTML=html||`<p class="vuoto">Nessun prodotto con questo nome. Puoi scriverlo in "Altro prodotto".</p>`;
  conta();
}
$("#categorie").addEventListener("click",e=>{
  const cat=e.target.closest(".cat");if(!cat)return;
  if(e.target.closest(".cat>button")){const c=cat.dataset.c;st.aperte[c]=!st.aperte[c];cat.classList.toggle("aperta",st.aperte[c]);e.target.closest("button").setAttribute("aria-expanded",!!st.aperte[c]);return}
  const b=e.target.closest(".passo button");if(!b)return;
  const r=b.closest(".riga"),k=r.dataset.k;
  st.q[k]=Math.max(0,(st.q[k]||0)+(b.classList.contains("piu")?1:-1));
  r.querySelector("output").textContent=st.q[k];r.classList.toggle("scelto",st.q[k]>0);
  const c=cat.dataset.c,n=DATI[st.reparto][c].filter(p=>st.q[key(c,p[0])]>0).length;
  cat.querySelector(".conta").innerHTML=(n?`<b>${n} scelti</b> · `:"")+DATI[st.reparto][c].length;
  conta();
});
$("#cerca").oninput=lista;
$("#altro-nome").oninput=e=>{st.altroNome=e.target.value.trim();conta()};
$("#altro-q").oninput=e=>{st.altroQ=e.target.value.trim();conta()};

function scelti(){
  const out=[];const cats=DATI[st.reparto];
  for(const c in cats){const r=cats[c].filter(p=>st.q[key(c,p[0])]>0).map(p=>({nome:p[0],dett:p[1],formato:p[2],q:st.q[key(c,p[0])]}));if(r.length)out.push({cat:c,righe:r})}
  if(st.altroNome)out.push({cat:"Altro",righe:[{nome:st.altroNome,dett:"",formato:"",q:st.altroQ||"da indicare"}]});
  return out;
}
function conta(){const n=scelti().reduce((a,g)=>a+g.righe.length,0);$("#vai-riepilogo").textContent="Riepilogo, "+n+(n===1?" prodotto":" prodotti")}

$("#vai-riepilogo").onclick=()=>{
  const g=scelti();
  $("#chi-riep").textContent=st.reparto+", "+st.sede;
  $("#riepilogo").innerHTML=g.length?g.map(x=>`<p class="etichetta">${esc(x.cat)}</p><div class="scelte">`+x.righe.map(r=>`<div class="riga scelto"><span class="nome">${esc(r.nome)}<span class="dett">${esc(r.formato||"")}</span></span><b>${esc(r.q)}</b></div>`).join("")+`</div>`).join(""):`<p class="vuoto">Non hai ancora scelto nessun prodotto.</p>`;
  $("#err-riep").textContent="";vai("riepilogo");
};
$("#note").oninput=e=>st.note=e.target.value.trim();
const inB64=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
$("#invia").onclick=async()=>{
  const g=scelti(),btn=$("#invia");if(!g.length){$("#err-riep").textContent="Aggiungi almeno un prodotto prima di inviare.";return}
  if(btn.disabled)return;
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  st.ultimo={num:p(d.getDate())+p(d.getMonth()+1)+"-"+p(d.getHours())+p(d.getMinutes()),data:p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear(),ora:p(d.getHours())+":"+p(d.getMinutes()),nome:st.nome,sede:st.sede,reparto:st.reparto,gruppi:g,note:st.note};
  btn.disabled=true;btn.textContent="Invio in corso";$("#err-riep").textContent="";
  try{
    await libPdf();
    const r=await json("/api/ordine",{sede:st.sede,reparto:st.reparto,num:st.ultimo.num,pdf:inB64(await creaPdf(st.ultimo))}),e=await r.json().catch(()=>({}));
    if(r.status===401){st.nome="";st.dopo="riepilogo";$("#err-accesso").textContent=e.errore||"";vai("accesso");return}
    // 503: email not set up yet, fall back to the PDF download
    if(!r.ok&&r.status!==503){$("#err-riep").textContent=(e.errore||"Invio non riuscito.")+" L'ordine non è partito.";return}
    $("#t-fatto em").textContent=r.ok?"inviato":"pronto";
    $("#fatto-msg").textContent=r.ok?"È arrivato a Gabriele per email. Se ti serve, scarica il PDF.":"L'invio per email non è ancora attivo. Scarica il PDF e mandalo a Gabriele.";
    $("#fatto-num").textContent="Ordine n. "+st.ultimo.num+", "+st.reparto+", "+st.sede+".";
    $("#err-pdf").textContent="";$("#nota-pdf").textContent="";vai("fatto");
  }catch(x){$("#err-riep").textContent="Nessuna connessione, l'ordine non è partito. Riprova."}
  finally{btn.disabled=false;btn.textContent="Invia ordine"}
};
$("#nuovo").onclick=()=>{st.q={};st.aperte={};st.altroNome=st.altroQ=st.note="";$("#altro-nome").value=$("#altro-q").value=$("#note").value="";inizio();vai("inizio")};

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function carica(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function libPdf(){
  if(!window.PDFLib)await carica("pdf-lib.min.js");
  if(!window.fontkit){try{await carica("fontkit.umd.min.js")}catch(e){}}
}
async function creaPdf(o){
  const {PDFDocument,rgb,StandardFonts}=window.PDFLib;
  const doc=await PDFDocument.create();
  let F;
  try{if(!window.fontkit)throw 0;doc.registerFontkit(window.fontkit);
    F={r:await doc.embedFont(b64(FONT.m4),{subset:true}),b:await doc.embedFont(b64(FONT.m7),{subset:true}),s:await doc.embedFont(b64(FONT.isr),{subset:true}),si:await doc.embedFont(b64(FONT.isi),{subset:true})}}
  catch(e){F={r:await doc.embedFont(StandardFonts.Helvetica),b:await doc.embedFont(StandardFonts.HelveticaBold),s:await doc.embedFont(StandardFonts.TimesRoman),si:await doc.embedFont(StandardFonts.TimesRomanItalic)}}
  const hex=h=>rgb(parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255);
  const C={ink:hex("#221812"),pom:hex("#c8301e"),deep:hex("#9c260b"),latte:hex("#fbf6ea"),linea:hex("#e2cf9f"),muto:hex("#5f4a3a")};
  const logo=await doc.embedPng(b64(LOGO_PNG));
  const W=595.28,H=841.89,M=42,X={prod:M,form:330,q:482,ck:W-M-11};
  let pg,y,pagine=[];
  const t=(s,x,yy,f,sz,c)=>pg.drawText(String(s),{x,y:yy,font:f,size:sz,color:c||C.ink});
  const rt=(s,x,yy,f,sz,c)=>t(s,x-f.widthOfTextAtSize(String(s),sz),yy,f,sz,c);
  const TR=1.3;
  const lw=(s,f,sz)=>String(s).toUpperCase().split("").reduce((a,ch)=>a+f.widthOfTextAtSize(ch,sz)+TR,-TR);
  const et=(s,x,yy,dx)=>{let xx=dx?x-lw(s,F.b,7.5):x;for(const ch of String(s).toUpperCase()){t(ch,xx,yy,F.b,7.5,C.deep);xx+=F.b.widthOfTextAtSize(ch,7.5)+TR}};
  function a_capo(s,f,sz,w){const out=[];let l="";for(const p of String(s).split(" ")){const n=l?l+" "+p:p;if(f.widthOfTextAtSize(n,sz)>w&&l){out.push(l);l=p}else l=n}if(l)out.push(l);return out}
  function intestaTabella(){et("Prodotto",X.prod,y);et("Formato",X.form,y);et("Qtà",X.q,y,1);et("Arrivato",W-M,y,1);y-=8;pg.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.8,color:C.ink});y-=16}
  function nuova(prima){
    pg=doc.addPage([W,H]);pagine.push(pg);
    pg.drawRectangle({x:0,y:0,width:W,height:H,color:C.latte});
    const lw=118,lh=lw*196/606;
    pg.drawImage(logo,{x:M,y:H-M-lh,width:lw,height:lh});
    rt("Ordine n. "+o.num,W-M,H-M-12,F.b,9);
    rt(o.data+", ore "+o.ora,W-M,H-M-25,F.r,9,C.muto);
    y=H-M-lh-12;pg.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:1.2,color:C.pom});y-=14;
    if(prima){
      y-=26;t("Ordine ",M,y,F.s,34,C.ink);t(o.reparto.toLowerCase(),M+F.s.widthOfTextAtSize("Ordine ",34),y,F.si,34,C.pom);y-=24;
      [["Sede",o.sede],["Reparto",o.reparto],["Ordinato da",o.nome],["Data",o.data+", ore "+o.ora]].forEach(([a,b])=>{et(a,M,y);t(b,M+92,y,F.r,10);y-=15});
      y-=14;
    }
    intestaTabella();
  }
  nuova(true);
  for(const g of o.gruppi){
    if(y<M+70)nuova(false);
    t(g.cat,M,y,F.b,10.5,C.ink);y-=15;
    for(const r of g.righe){
      const dett=a_capo(r.dett||"",F.r,8,270),form=a_capo(r.formato||"",F.r,9.5,135);
      const h=Math.max(13+dett.length*10,form.length*12)+8;
      if(y-h<M+30){nuova(false);t(g.cat+" (segue)",M,y,F.b,10.5,C.ink);y-=15}
      t(r.nome,X.prod,y,F.r,10);dett.forEach((l,i)=>t(l,X.prod,y-12-i*10,F.r,8,C.muto));
      form.forEach((l,i)=>t(l,X.form,y-i*12,F.r,9.5,C.muto));
      rt(r.q,X.q,y,F.b,11);
      pg.drawRectangle({x:X.ck,y:y-2,width:11,height:11,borderColor:C.ink,borderWidth:.8});
      y-=h-8;pg.drawLine({start:{x:M,y:y+3},end:{x:W-M,y:y+3},thickness:.5,color:C.linea});y-=11;
    }
    y-=8;
  }
  if(o.note){const l=a_capo(o.note,F.r,10,W-2*M);if(y-30-l.length*14<M+30)nuova(false);y-=4;et("Note",M,y);y-=15;l.forEach(x=>{t(x,M,y,F.r,10);y-=14})}
  pagine.forEach((p,i)=>{pg=p;t("Annaré, ordini interni",M,M-14,F.r,8,C.muto);rt("pag. "+(i+1)+" di "+pagine.length,W-M,M-14,F.r,8,C.muto)});
  return await doc.save();
}
window.creaPdf=creaPdf;window.stUltimo=()=>st.ultimo;window.libPdf=libPdf;
$("#scarica").onclick=async()=>{
  const btn=$("#scarica");$("#err-pdf").textContent="";btn.textContent="Preparo il PDF";
  try{
    await libPdf();const bytes=await creaPdf(st.ultimo);
    const nome="Ordine "+st.ultimo.reparto+" "+st.ultimo.num+".pdf";
    const file=new File([bytes],nome,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:nome})}catch(e){if(e.name!=="AbortError")throw e}}
    else{const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
    $("#nota-pdf").textContent="PDF pronto.";
  }catch(e){$("#err-pdf").textContent="Non sono riuscito a creare il PDF. Controlla la connessione e riprova."}
  finally{btn.textContent="Scarica PDF"}
};
inizio();
$("#v-accesso").prepend($("#v-inizio .logo").cloneNode(true));
sessione();
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
let richiesta=null;
if(!standalone&&ios){$("#installa").hidden=false;$("#installa").innerHTML="<p><b>Installa l'app sul telefono.</b></p><p>In Safari tocca il tasto Condividi, il quadrato con la freccia in su, poi scegli \"Aggiungi alla schermata Home\".</p>"}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();richiesta=e;if(standalone)return;$("#installa").hidden=false;$("#installa").innerHTML='<p><b>Installa l\'app sul telefono.</b> Così la apri dall\'icona, come le altre app.</p><button class="pill" id="btn-installa">Installa l\'app</button>';$("#btn-installa").onclick=async()=>{richiesta.prompt();await richiesta.userChoice;richiesta=null;$("#installa").hidden=true}});
addEventListener("appinstalled",()=>{$("#installa").hidden=true});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js");
</script>
